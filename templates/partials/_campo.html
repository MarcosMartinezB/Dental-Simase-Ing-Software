{# Uso: {% include 'partials/_campo.html' with campo=form.nombre %} #}
<div class="campo">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} *{% endif %}</label>
  {{ campo }}
  {% if campo.help_text %}<span class="ayuda">{{ campo.help_text }}</span>{% endif %}
  {% for e in campo.errors %}<span class="error-campo">{{ e }}</span>{% endfor %}
</div>
